# ============================================================
# codexloop.conf - TEMPLATE. Copy into the deployment directory and adjust.
# The loop reloads this file between iterations (changes need no restart).
# ============================================================

# Deployment name (screen session, systemd unit, notification prefix).
NAME=myproject

# Project directory (agent cwd).
PROJECT_DIR=/path/to/project

# Prompt for every session of the main front.
PROMPT=familiarize yourself with the project and continue

# 1 = append the ITER_DONE/HUMAN_NEEDED protocol instructions to the prompt
EXTRA_SUFFIX=1

# Hint text telling the agent when to close a session (suffix + re-prompts).
NATURAL_END_HINT=about 40% of the context window

# ---- Second front (optional) ---------------------------------------
# Every N-th iteration runs FRONT2_PROMPT instead of PROMPT. 0 = disabled.
FRONT2_EVERY_N=0
FRONT2_PROMPT=
# Second-front state file (relative to PROJECT_DIR); if missing, front2
# iterations fall back to the main front (safety).
FRONT2_STATE_FILE=

# ---- Codex -----------------------------------------------------------
CODEX_BIN=codex
CODEX_ARGS=--dangerously-bypass-approvals-and-sandbox
# Extra arguments for the interactive TUI only (never passed to codex exec).
# Keep the session process-local so closing its screen ends the iteration.
# Set TUI_EXTRA_ARGS= for an older Codex CLI without --no-daemon.
TUI_EXTRA_ARGS=--no-daemon

# ---- Environment -----------------------------------------------------
# Health check run before each iteration (exit 0 = OK). Empty = skip.
# Example, ssh tunnel to a vLLM server:
#HEALTHCHECK_CMD=python3 -c "import socket; socket.create_connection(('127.0.0.1',18001),5)"
# Fix attempted once on failure (e.g. `systemctl restart my-tunnel`).
# Empty = no fix attempt.
#HEALTHFIX_CMD=

# ---- Thresholds -------------------------------------------------------
# Session longer than this -> killed + notification.
MAX_ITER_MINUTES=480
# No new TUI output for this long -> stall notification.
STALL_NOTIFY_MIN=45
# Session shorter than this -> suspicious -> notification.
MIN_OK_MINUTES=20
# If the TUI ends a turn without ITER_DONE, the loop re-sends "continue".
REPROMPT_MIN_S=120
REPROMPT_MAX=6

PAUSE_BETWEEN_ITERS_S=15
FAIL_BACKOFF_CAP_MIN=30
READY_WAIT_S=20
INJECT_VERIFY_S=180
SCREEN_NAME=

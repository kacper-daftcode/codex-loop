# ============================================================
# codexloop.conf - SZABLON. Skopiuj do katalogu deploymentu i uzupelnij.
# Petla przeladowuje ten plik miedzy iteracjami (zmiany bez restartu).
# ============================================================

# Nazwa deploymentu (screen, jednostka systemd, prefix wiadomosci).
NAME=myproject

# Katalog projektu (cwd agenta).
PROJECT_DIR=/path/to/project

# Prompt kazdej sesji glownego frontu.
PROMPT=zapoznaj sie z projektem i kontynuuj

# 1 = doklej do promptu instrukcje protokolu ITER_DONE/HUMAN_NEEDED
EXTRA_SUFFIX=1

# Tekstowa wskazowka, kiedy agent ma zamykac sesje (w suffixu i repromptach).
NATURAL_END_HINT=ok. 40% kontekstu

# ---- Drugi front (opcjonalny) -------------------------------------
# Co N-ta iteracja dostaje FRONT2_PROMPT zamiast PROMPT. 0 = wylaczone.
FRONT2_EVERY_N=0
FRONT2_PROMPT=
# Plik-stan drugiego frontu (wzgledem PROJECT_DIR); jesli nie istnieje,
# iteracje frontu2 skladuja sie do frontu glownego (bezpiecznik).
FRONT2_STATE_FILE=

# ---- Codex ---------------------------------------------------------
CODEX_BIN=codex
CODEX_ARGS=--dangerously-bypass-approvals-and-sandbox

# ---- Srodowisko ----------------------------------------------------
# Komenda zdrowia przed kazda iteracja (exit 0 = OK). Puste = pomiń.
# Przyklad tunelu ssh do vLLM:
#HEALTHCHECK_CMD=python3 -c "import socket; socket.create_connection(('127.0.0.1',18001),5)"
# Naprawa przy FAIL (np.`systemctl restart kimi-tunnel`); puste = bez naprawy.
#HEALTHFIX_CMD=

# ---- Progi ----------------------------------------------------------
# Sesja dluzsza -> ubicie + notyfikacja.
MAX_ITER_MINUTES=480
# Brak nowego outputu TUI tyle minut -> notyfikacja o stallu.
STALL_NOTIFY_MIN=45
# Sesja krotsza -> podejrzana -> notyfikacja.
MIN_OK_MINUTES=20
# Gdy TUI konczy ture bez ITER_DONE, petla dosyla "kontynuuj".
REPROMPT_MIN_S=120
REPROMPT_MAX=6

PAUSE_BETWEEN_ITERS_S=15
FAIL_BACKOFF_CAP_MIN=30
READY_WAIT_S=20
INJECT_VERIFY_S=180
SCREEN_NAME=

name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Python syntax
        run: python3 -m py_compile codexloop.py
      - name: Check shell syntax
        run: bash -n install.sh notify.sh signal-setup.sh watch.py
